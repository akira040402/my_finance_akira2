<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="MY FINANCE - Personal Finance Manager. Data keuangan tersimpan lokal di browser Anda.">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MY FINANCE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <title>MY FINANCE</title>
</head>
<body>
  <a class="skip" href="#main">Lewati ke konten</a>

  <div id="lock-root" hidden></div>

  <div id="app" class="app" hidden>
    <aside class="sidebar" aria-label="Menu utama">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1"/></svg>
        </div>
        <div>
          <div class="brand-name">MY FINANCE</div>
          <div class="brand-sub">Personal Finance Manager</div>
        </div>
      </div>
      <nav id="side-nav" class="side-nav"></nav>
      <div class="side-foot">
        <button class="side-link" data-action="quick-add">+ Tambah transaksi</button>
        <button class="side-link" data-action="lock-now">Kunci aplikasi</button>
      </div>
    </aside>

    <div class="content">
      <header class="topbar">
        <div class="mobile-brand">MY FINANCE</div>
        <button class="icon-btn" data-action="menu-open" aria-label="Menu lainnya">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </header>
      <main id="main" class="main" tabindex="-1"></main>
    </div>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Navigasi bawah"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
